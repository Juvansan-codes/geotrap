<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GeoTrap Admin</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="admin-panel">
      <h1>GeoTrap Admin</h1>
      <form id="admin-form">
        <label for="admin-secret">Admin secret</label>
        <input id="admin-secret" name="admin-secret" type="password" required>
        <button class="button" type="submit">View locations</button>
      </form>
      <p id="admin-message" role="status"></p>
      <div id="locations" class="location-list"></div>
    </main>
    <script src="admin.js"></script>
  </body>
</html>
